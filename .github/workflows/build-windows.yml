name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, macos]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ort-sys 的构建脚本会把 DirectML.dll 放进 target/<profile>/{deps,examples}；
      # 没有缓存的全新构建里这些目录还不存在，脚本会直接崩，所以先建好
      - name: Prepare target dirs
        shell: bash
        run: mkdir -p src-tauri/target/{debug,release}/{deps,examples}

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build installer
        run: pnpm tauri build

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SayDo-windows
          path: |
            src-tauri/target/release/saydo.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
