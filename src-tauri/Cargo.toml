[package]
name = "saydo"
version = "0.1.0"
description = "SayDo — 选中 + 按住热键 + 说话，桌面快捷 Agent"
authors = ["you"]
edition = "2021"

[lib]
name = "saydo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "native-tls", "multipart"] }
tokio = { version = "1", features = ["time", "rt", "macros", "sync", "process", "io-util"] }
futures-util = "0.3"
cpal = "0.15"
ort = "=2.0.0-rc.10"
ndarray = "0.16"
base64 = "0.22"
image = "0.25"
xcap = "0.9"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
opt-level = "s"
